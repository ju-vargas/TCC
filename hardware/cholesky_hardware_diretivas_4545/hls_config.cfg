part=xcu50-fsvh2104-2-e

[hls]
package.output.format=ip_catalog
package.output.syn=false
# Topo da sintese: cholesky_inverse (so A e a inversa como portas). O testbench
# chama tambem cholesky_decomposition, que expoe cada etapa, e confere que as
# duas dao a mesma inversa.
syn.top=cholesky_inverse

# Parametros do hardware (ver cholesky.h). As duas linhas precisam ser iguais:
# syn.cflags vale para o codigo do hardware e tb.cflags para o testbench.
# Opcoes: CHOL_N, CHOL_INT_BITS, CHOL_FRAC_BITS, CHOL_QUANT, CHOL_OVERFLOW,
# CHOL_ACC_* (acumulador; padrao = o dobro dos bits e os mesmos modos) e os
# intermediarios CHOL_MULIN_*, CHOL_PROD_*, CHOL_CMUL_*, CHOL_NUM_*, CHOL_NORM_*,
# CHOL_QUOT_*, CHOL_SUM_* (_INT_BITS, _FRAC_BITS, _QUANT, _OVERFLOW) e
# CHOL_SQRT_* (so _INT_BITS e _FRAC_BITS); padroes no cholesky.h.
syn.cflags=-DCHOL_N=8 -DCHOL_INT_BITS=8 -DCHOL_FRAC_BITS=8 -DCHOL_QUANT=AP_TRN -DCHOL_OVERFLOW=AP_SAT
tb.cflags=-DCHOL_N=8 -DCHOL_INT_BITS=8 -DCHOL_FRAC_BITS=8 -DCHOL_QUANT=AP_TRN -DCHOL_OVERFLOW=AP_SAT
tb.file=tb_lu_decomposition.cpp
syn.file=cholesky.h
syn.file=cholesky_ops.h
syn.file=cholesky_decomposition.cpp
syn.file=lu_decomposition.cpp
syn.file=dv_step.cpp
syn.file=s_step.cpp
syn.file=g_step.cpp
syn.file=foward_substitution.cpp
syn.file=inversion.cpp
syn.file=cholesky_top.cpp
