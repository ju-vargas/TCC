part=xcu50-fsvh2104-2-e

[hls]
# Síntese do topo cholesky_inverse em ap_fixed<24,12> (12 bits inteiros com o
# sinal, 12 fracionários), AP_TRN e AP_SAT, matriz 16 x 16 (M_c = 16), a 100 MHz.
# Sem diretivas: nem pragmas no código nem syn.directive.* aqui, para ter a
# versão de partida antes de otimizar. Acumulador e intermediários ficam nos
# padrões do cholesky.h (acumulador ap_fixed<48,24>, produto exato de 96 bits).
# pipeline_loops=0 desliga o pipeline automático que o Vitis aplica sozinho nos
# laços internos (padrão 64). Sem isso a síntese já sai com 12 laços pipelinados.
#
# Rodar nesta pasta:
#   v++ -c --mode hls --config hls_config_sintese_24_12.cfg --work_dir sinteses/24-12_16x16_sem_otimizacao
# Relatório: o arquivo *_csynth.rpt dentro de sinteses/24-12_16x16_sem_otimizacao/
clock=10ns
syn.compile.pipeline_loops=0
syn.top=cholesky_inverse
package.output.format=ip_catalog
package.output.syn=false

syn.cflags=-DCHOL_N=16 -DCHOL_INT_BITS=12 -DCHOL_FRAC_BITS=12 -DCHOL_QUANT=AP_TRN -DCHOL_OVERFLOW=AP_SAT
tb.cflags=-DCHOL_N=16 -DCHOL_INT_BITS=12 -DCHOL_FRAC_BITS=12 -DCHOL_QUANT=AP_TRN -DCHOL_OVERFLOW=AP_SAT
tb.file=tb_lu_decomposition.cpp
syn.file=cholesky.h
syn.file=cholesky_ops.h
syn.file=cholesky_decomposition.cpp
syn.file=lu_decomposition.cpp
syn.file=dv_step.cpp
syn.file=s_step.cpp
syn.file=g_step.cpp
syn.file=foward_substitution.cpp
syn.file=inversion.cpp
syn.file=cholesky_top.cpp
